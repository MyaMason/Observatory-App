<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Metaphysical Observatory</title>
  <meta name="description" content="An immersive, private journey through seven realms of philosophical inquiry. Discover, examine and chart your own worldview." />
  <meta name="theme-color" content="#0b1026" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Observatory" />
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <script src="asset-list.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <div id="app" aria-busy="true">
    <header class="appbar">
      <a class="appbar-home" href="#/observatory" aria-label="The Observatory, home">
        <svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="50" cy="50" r="44" stroke-width="3"/><path d="M50 12 L66.3 83.7 L15.6 37.6 L84.4 37.6 L33.7 83.7Z" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="52" r="7" fill="currentColor" stroke="none"/></svg>
        <span>The Observatory</span>
      </a>
      <a class="appbar-archive" href="#/archive" aria-label="The Archive: settings, backup and data">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="7" stroke-dasharray="2 2.4"/></svg>
      </a>
    </header>

    <main id="view" tabindex="-1"><noscript><p style="padding:2rem">The Observatory needs JavaScript to run.</p></noscript></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/observatory" data-tab="observatory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3.5 L14.6 9.4 L20.5 12 L14.6 14.6 L12 20.5 L9.4 14.6 L3.5 12 L9.4 9.4Z"/></svg>
        <span>Observatory</span></a>
      <a href="#/atlas" data-tab="atlas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 L9 7 L15 11 L20 4"/><circle cx="4" cy="17" r="1.6"/><circle cx="9" cy="7" r="1.6"/><circle cx="15" cy="11" r="1.6"/><circle cx="20" cy="4" r="1.6"/><path d="M9 7 L11 19 L15 11" opacity=".55"/><circle cx="11" cy="19" r="1.2"/></svg>
        <span>Atlas</span></a>
      <a href="#/challenges" data-tab="challenges">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="3.6"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.5"/></svg>
        <span>Challenges</span></a>
      <a href="#/journal" data-tab="journal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h11l3 3v14H5z"/><path d="M8 9h8M8 12.5h8M8 16h5"/><path d="M16 3.5v3h3"/></svg>
        <span>Journal</span></a>
      <a href="#/evolution" data-tab="evolution">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c0-1 1-1.6 1.8-1.2 1.4.6 1.2 2.9-.4 3.5-2.4.9-4.6-1.4-4-3.8.8-3.2 4.7-4.3 7.3-2.4 3.3 2.4 2.7 7.5-.8 9.3-4.2 2.1-9.6-.5-10.2-5.3"/></svg>
        <span>Evolution</span></a>
    </nav>
  </div>

  <div id="update-bar" class="update-bar" role="status" hidden>
    <span>A new edition of the Observatory is ready.</span>
    <button class="btn btn-primary small" id="update-btn">Refresh</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
